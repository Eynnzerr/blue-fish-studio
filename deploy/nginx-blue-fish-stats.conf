# Include inside the existing HTTPS server block for eynnzerr.cloud.
location ^~ /blue-fish/api/v1/stats {
    client_max_body_size 1k;
    limit_req zone=blue_fish_stats_per_ip burst=10 nodelay;
    limit_req_status 429;
    error_page 429 = @blue_fish_stats_rate_limited;
    access_log /var/log/nginx/blue-fish-stats-access.log blue_fish;

    proxy_pass http://127.0.0.1:8791/api/v1/stats;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 10s;
}

location @blue_fish_stats_rate_limited {
    default_type application/json;
    charset utf-8;
    add_header Retry-After 1 always;
    return 429 '{"error":{"code":"STATS_RATE_LIMITED","message":"统计请求过于频繁，请稍后重试"}}';
}

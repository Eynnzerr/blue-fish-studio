# Include once inside the existing http block, before its server blocks.
limit_req_zone $binary_remote_addr zone=blue_fish_per_ip:1m rate=20r/m;

# Omit request bodies, query strings, and credentials from the API access log.
log_format blue_fish escape=json
    '{"time":"$time_iso8601","address":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time}';

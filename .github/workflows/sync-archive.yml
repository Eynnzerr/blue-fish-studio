name: Sync archive assets

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      label_images:
        description: Label pending archive images when an API key is configured
        type: boolean
        default: true
      label_limit:
        description: Maximum archive images to label in this run
        type: number
        default: 25

permissions:
  contents: read

concurrency:
  group: archive-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      assets_changed: ${{ steps.commit.outputs.assets_changed }}
    steps:
      - name: Check upstream main and pending labels
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          KEY_CONFIGURED: ${{ secrets.LABEL_API_KEY != '' }}
          AUTO_LABEL_ENABLED: ${{ vars.LABEL_AUTO_ENABLED == 'true' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          LABEL_REQUESTED: ${{ github.event_name != 'workflow_dispatch' || inputs.label_images }}
        run: |
          upstream_sha=$(gh api repos/EDMOK/blue-fish-archive/commits/main --jq .sha)
          previous_sha=""
          # Poll small records through the API without checking out the image library.
          checkpoint_blob=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github?ref=main" \
            --jq '.[] | select(.name == "blue-fish-archive.sha") | .sha')
          if [ -n "$checkpoint_blob" ]; then
            previous_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/blobs/$checkpoint_blob" \
              --jq .content | base64 --decode)
          fi
          pending=$(gh api "repos/$GITHUB_REPOSITORY/contents/metadata/label-status.json?ref=main" \
            --jq .content | base64 --decode | jq -r .pending)
          echo "sha=$upstream_sha" >> "$GITHUB_OUTPUT"

          should_run=false
          should_import=false
          should_label=false
          if [ "$upstream_sha" != "$previous_sha" ] || [ "$MANUAL_RUN" = true ]; then
            should_run=true
            should_import=true
          fi
          if [ "$KEY_CONFIGURED" = true ] && [ "$AUTO_LABEL_ENABLED" = true ] && [ "$pending" -gt 0 ]; then
            should_run=true
          fi
          if [ "$should_run" = true ] && [ "$KEY_CONFIGURED" = true ] && [ "$LABEL_REQUESTED" = true ] \
            && { [ "$MANUAL_RUN" = true ] || [ "$AUTO_LABEL_ENABLED" = true ]; }; then
            should_label=true
          fi
          echo "run=$should_run" >> "$GITHUB_OUTPUT"
          echo "import=$should_import" >> "$GITHUB_OUTPUT"
          echo "label=$should_label" >> "$GITHUB_OUTPUT"
          echo "Pending image labels: $pending. Import: $should_import. Label: $should_label." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out the latest project
        if: steps.upstream.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check out the upstream snapshot
        if: steps.upstream.outputs.import == 'true'
        uses: actions/checkout@v6
        with:
          repository: EDMOK/blue-fish-archive
          ref: ${{ steps.upstream.outputs.sha }}
          path: .archive-source
          persist-credentials: false

      - name: Set up Node.js
        if: steps.upstream.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Import archive images and metadata
        if: steps.upstream.outputs.import == 'true'
        run: node scripts/sync-assets.mjs "$GITHUB_WORKSPACE/.archive-source"

      - name: Refresh the pending label count
        if: steps.upstream.outputs.run == 'true'
        id: scan
        run: |
          node scripts/label-stickers.mjs --scan-only
          pending=$(jq -r .pending metadata/label-status.json)
          echo "pending=$pending" >> "$GITHUB_OUTPUT"

      - name: Install image labeling dependencies
        if: steps.upstream.outputs.label == 'true' && steps.scan.outputs.pending != '0'
        run: npm ci

      - name: Label pending archive images
        if: steps.upstream.outputs.label == 'true' && steps.scan.outputs.pending != '0'
        continue-on-error: true
        env:
          LABEL_API_KEY: ${{ secrets.LABEL_API_KEY }}
          LABEL_API_BASE_URL: ${{ vars.LABEL_API_BASE_URL || 'https://llmapi.paratera.com/v1' }}
          LABEL_MODEL: ${{ vars.LABEL_MODEL || 'Qwen3.8-Flash' }}
          LABEL_MAX_ITEMS: ${{ vars.LABEL_MAX_ITEMS || '50' }}
          MANUAL_RUN: ${{ github.event_name == 'workflow_dispatch' }}
          INPUT_LIMIT: ${{ inputs.label_limit }}
        run: |
          label_limit="$LABEL_MAX_ITEMS"
          if [ "$MANUAL_RUN" = true ]; then
            label_limit="$INPUT_LIMIT"
          fi
          node scripts/label-stickers.mjs --limit "$label_limit"

      - name: Commit the synchronized snapshot
        if: steps.upstream.outputs.run == 'true'
        id: commit
        env:
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          git add -A -- public/archive public/stickers.json
          if git diff --cached --quiet -- public/archive public/stickers.json; then
            echo "assets_changed=false" >> "$GITHUB_OUTPUT"
            echo "The public image library is unchanged." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "assets_changed=true" >> "$GITHUB_OUTPUT"
            echo "Archive assets updated; GitHub Pages will be redeployed." >> "$GITHUB_STEP_SUMMARY"
          fi
          printf '%s\n' "$UPSTREAM_SHA" > .github/blue-fish-archive.sha
          git add -- .github/blue-fish-archive.sha metadata/sticker-labels.json metadata/label-status.json
          if git diff --cached --quiet; then
            echo "No snapshot or label changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync archive assets and labels ${UPSTREAM_SHA:0:7}"
          # Preserve changes pushed to main while the archive was downloading.
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: sync
    if: needs.sync.outputs.assets_changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

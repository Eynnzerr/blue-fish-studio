name: blue-fish-studio-stats

services:
  stats:
    image: ${STATS_RUNTIME_IMAGE:-node:22-bookworm-slim}
    init: true
    restart: unless-stopped
    user: "1000:1000"
    working_dir: /app
    command: ["node", "--experimental-strip-types", "--max-old-space-size=32", "server/stats-server.ts"]
    read_only: true
    ports:
      - "127.0.0.1:${STATS_PORT:-8791}:8791"
    environment:
      HOST: 0.0.0.0
      PORT: "8791"
      STATS_DB_PATH: /app/data/stats.sqlite
      STATS_ALLOWED_ORIGINS: ${STATS_ALLOWED_ORIGINS:-https://fish.eynnzerr.cloud,https://eynnzerr.github.io}
      STATS_RATE_LIMIT_PER_MINUTE: ${STATS_RATE_LIMIT_PER_MINUTE:-3000}
    volumes:
      - ./server:/app/server:ro
      - ./data:/app/data
    mem_limit: 96m
    memswap_limit: 128m
    cpus: 0.5
    healthcheck:
      # Avoid loading fetch/Undici for each short-lived health probe.
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8791/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

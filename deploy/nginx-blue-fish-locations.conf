# Include inside the existing HTTPS server block for eynnzerr.cloud.
location ^~ /blue-fish/ {
    error_page 401 = @blue_fish_unauthorized;
    if ($blue_fish_allowed = 0) {
        return 401;
    }

    client_max_body_size 8k;
    client_body_timeout 10s;
    limit_req zone=blue_fish_per_ip burst=3 nodelay;
    limit_req_status 429;
    error_page 429 = @blue_fish_rate_limited;
    # Bound active image requests across all clients; statistics has its own location.
    limit_conn blue_fish_connections 4;
    limit_conn blue_fish_connections_per_ip 2;
    limit_conn_status 503;
    error_page 503 = @blue_fish_busy;
    access_log /var/log/nginx/blue-fish-access.log blue_fish;

    # The trailing slash removes /blue-fish/ before forwarding to the API.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    # Stream generated PNGs without writing response bodies to proxy temp files.
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 3s;
    proxy_send_timeout 10s;
    proxy_read_timeout 30s;
}

location @blue_fish_unauthorized {
    access_log /var/log/nginx/blue-fish-access.log blue_fish;
    default_type application/json;
    charset utf-8;
    add_header WWW-Authenticate Bearer always;
    add_header Cache-Control no-store always;
    return 401 '{"error":{"code":"UNAUTHORIZED","message":"需要有效的 Bearer API Key。"}}';
}

location @blue_fish_busy {
    access_log /var/log/nginx/blue-fish-access.log blue_fish;
    default_type application/json;
    charset utf-8;
    add_header Retry-After 2 always;
    return 503 '{"error":{"code":"RENDER_BUSY","message":"当前图片请求已满，请稍后重试。"}}';
}

location @blue_fish_rate_limited {
    access_log /var/log/nginx/blue-fish-access.log blue_fish;
    default_type application/json;
    charset utf-8;
    add_header Retry-After 3 always;
    return 429 '{"error":{"code":"rate_limited","message":"请求过于频繁，请稍后再试。"}}';
}

# Include inside the existing HTTPS server block for eynnzerr.cloud.
location ^~ /blue-fish/ {
    client_max_body_size 8k;
    limit_req zone=blue_fish_per_ip burst=5 nodelay;
    limit_req_status 429;
    error_page 429 = @blue_fish_rate_limited;
    access_log /var/log/nginx/blue-fish-access.log blue_fish;

    # The trailing slash removes /blue-fish/ before forwarding to the API.
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    # Stream generated PNGs without writing response bodies to proxy temp files.
    proxy_buffering off;
    proxy_intercept_errors off;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    include /etc/nginx/snippets/blue-fish-secret.conf;
    proxy_read_timeout 30s;
}

location @blue_fish_rate_limited {
    access_log /var/log/nginx/blue-fish-access.log blue_fish;
    default_type application/json;
    charset utf-8;
    add_header Retry-After 3 always;
    return 429 '{"error":{"code":"rate_limited","message":"请求过于频繁，请稍后再试。"}}';
}

# Include once inside the existing http block, before its server blocks.
# Allow public callers and valid private credentials; reject invalid nonempty credentials early.
map $http_authorization $blue_fish_allowed {
    default 0;
    "" 1;
    include /etc/nginx/snippets/blue-fish-secret.conf;
}

limit_req_zone $binary_remote_addr zone=blue_fish_per_ip:1m rate=20r/m;
limit_req_zone $binary_remote_addr zone=blue_fish_stats_per_ip:1m rate=60r/m;
limit_conn_zone $server_name zone=blue_fish_connections:1m;
limit_conn_zone $binary_remote_addr zone=blue_fish_connections_per_ip:1m;

# Omit request bodies, query strings, and credentials from the API access log.
log_format blue_fish escape=json
    '{"time":"$time_iso8601","address":"$remote_addr",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"seconds":$request_time}';

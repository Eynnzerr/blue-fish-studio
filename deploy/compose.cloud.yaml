name: blue-fish-studio

services:
  api:
    image: blue-fish-studio-api:cloud-27384b3
    init: true
    restart: unless-stopped
    command: ["node", "--experimental-strip-types", "--max-old-space-size=96", "server/index.ts"]
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      API_KEY: ${API_KEY:?Set API_KEY in .env.api}
      HOST: 0.0.0.0
      PORT: "8787"
      MAX_CONCURRENT_RENDERS: "1"
      RATE_LIMIT_PER_MINUTE: "30"
      ALLOW_ANONYMOUS_RENDER: "true"
      PUBLIC_RATE_LIMIT_PER_MINUTE: "24"
      STATS_DB_PATH: /app/data/stats.sqlite
      STATS_ALLOWED_ORIGINS: https://fish.eynnzerr.cloud,https://eynnzerr.github.io
    volumes:
      - ./server:/app/server:ro
      - ./data:/app/data
    # Bound native Canvas allocations as well as the JavaScript heap.
    mem_limit: 512m
    memswap_limit: 640m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 15s
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8787/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 60s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
